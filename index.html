<style>
  :root{
    --ink:#0F0D0A;
    --ink-2:#1A1611;
    --sand:#E3B93C;
    --sand-dim:#A6883A;
    --flare:#E3B93C;
    --flare-dim:#C7A032;
    --paper:#EDEAE3;
    --olive:#4A4335;
    --olive-2:#332D22;
    --danger:#C1442A;
    --ok:#6B8F5C;
    --radius: 6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.02em;
    margin:0;
  }
  .hero h1{
    font-family:'Anton',sans-serif;
    letter-spacing:0.01em;
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px;
    background:rgba(15,13,10,0.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(201,168,118,0.2);
    gap:20px;
  }
  .topbar-right{display:flex; align-items:center; gap:22px;}
  .nav-links{display:flex; gap:22px;}
  .nav-links a{
    font-size:13px; font-weight:600; color:#C9C5B8;
    text-decoration:none; transition:color .15s ease;
  }
  .nav-links a:hover{color:var(--sand);}
  @media (max-width:720px){
    .nav-links{
      display:none; position:absolute; top:100%; left:0; right:0;
      flex-direction:column; gap:0; background:var(--ink-2);
      border-bottom:1px solid rgba(201,168,118,0.2); padding:8px 24px;
    }
    .nav-links.open{display:flex;}
    .nav-links a{padding:12px 0; border-bottom:1px solid rgba(201,168,118,0.1);}
    .nav-links a:last-child{border-bottom:none;}
    .menu-toggle{display:flex !important;}
  }
  .menu-toggle{
    display:none; background:none; border:1px solid var(--sand-dim); border-radius:6px;
    width:36px; height:36px; color:var(--paper); cursor:pointer;
    align-items:center; justify-content:center;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:'Oswald',sans-serif;
    font-size:19px; font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .brand .mark{
    width:26px; height:26px;
    background:var(--flare);
    clip-path:polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    display:inline-block;
  }
  .brand .boo{color:var(--sand);}
  .lang-toggle{
    display:flex; border:1px solid var(--sand-dim); border-radius:var(--radius); overflow:hidden;
  }
  .lang-toggle button{
    background:transparent; color:var(--paper); border:none;
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    padding:7px 14px; cursor:pointer; transition:background .15s ease;
  }
  .lang-toggle button.active{background:var(--sand); color:var(--ink);}
  .lang-toggle button:not(.active):hover{background:rgba(201,168,118,0.15);}

    padding:0 24px 40px;
  }
  .hero-bullets{
    display:flex; flex-wrap:wrap; gap:22px;
    margin-top:32px;
  }
  .hero-bullets span{
    display:flex; align-items:center; gap:8px;
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600;
    letter-spacing:0.08em; text-transform:uppercase; color:#C9C5B8;
  }
  .hero-bullets .dot{
    width:7px; height:7px; border-radius:50%; background:var(--sand); flex:0 0 auto;
  }
  .hero-bullets .dot.alt{background:#D9822B;}
  .hero-inner{
    max-width:640px;
    position:relative;
  }
  .hero-inner::before{
    content:"";
    position:absolute; left:-24px; top:-14px;
    width:5px; height:calc(100% + 14px);
    background:var(--flare);
  }
  .hero-inner{padding-left:20px;}
  .hero h1{
    font-size:clamp(38px, 7vw, 64px);
    line-height:0.98;
    color:var(--paper);
    text-shadow:0 2px 18px rgba(0,0,0,0.6);
  }
  .hero h1 .accent{color:var(--sand);}
  .hero p.lede{
    margin-top:18px;
    font-size:17px;
    max-width:520px;
    color:#D9D5CB;
    text-shadow:0 1px 10px rgba(0,0,0,0.7);
  }
  .hero-ctas{margin-top:28px; display:flex; gap:12px; flex-wrap:wrap;}
  .btn{
    display:inline-block;
    font-family:'Inter',sans-serif; font-weight:700; font-size:14px;
    padding:13px 24px;
    cursor:pointer;
    border:none; border-radius:var(--radius);
    text-decoration:none;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px);}

<script>
function toggleMenu(){
  document.getElementById('nav-links').classList.toggle('open');
}
function closeMenu(){
  document.getElementById('nav-links').classList.remove('open');
}

function toggleFaq(btn){
  const item = btn.parentElement;
  const wasOpen = item.classList.contains('open');
  document.querySelectorAll('#faq-list .faq-item').forEach(i => i.classList.remove('open'));
  if(!wasOpen) item.classList.add('open');
}

document.body.style.overflow = 'hidden';
function closeWelcome(){
  document.getElementById('welcome-overlay').classList.add('hide');
  document.body.style.overflow = '';
}

let lang = 'en';
let mode = null;

function setLang(l){
  lang = l;
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.getElementById('btn-es').classList.toggle('active', l==='es');
  document.querySelectorAll('[data-en]').forEach(el=>{
    const val = el.getAttribute('data-'+l);
    if(val !== null) el.innerHTML = val;
  });
  if(mode) renderFormCopy();
}

const copy = {
  buy: {
    en: {title:"Buy an account", sub:"Just leave your contact info — we'll reach out with matching accounts and prices."},
    es: {title:"Comprar una cuenta", sub:"Solo deja tu contacto — te enviaremos cuentas y precios disponibles."}
  },
  sell: {
    en: {title:"Sell your account", sub:"We confirm ownership using your recovery email address before listing anything."},
    es: {title:"Vender tu cuenta", sub:"Confirmamos la propiedad con tu correo de recuperación antes de publicar."}
  },
  trade: {
    en: {title:"Trade your account", sub:"We verify both sides of the trade using the recovery email address on file."},
    es: {title:"Intercambiar tu cuenta", sub:"Verificamos a ambas partes del intercambio usando el correo de recuperación."}
  }
};

function selectMode(m){
  mode = m;
  document.getElementById('card-buy').classList.toggle('selected', m==='buy');
  document.getElementById('card-sell').classList.toggle('selected', m==='sell');
  document.getElementById('card-trade').classList.toggle('selected', m==='trade');

  const form = document.getElementById('the-form');
  form.classList.remove('hide');

  const sellTradeFields = document.getElementById('sell-trade-fields');
  const detailsField = document.getElementById('details-field');
  const recoveryInput = document.getElementById('recovery_email_input');

  if(m === 'buy'){
    sellTradeFields.classList.add('hide');
    recoveryInput.required = false;
    detailsField.classList.remove('hide');
  } else {
    sellTradeFields.classList.remove('hide');
    recoveryInput.required = true;
    detailsField.classList.remove('hide');
  }

  renderFormCopy();
  form.scrollIntoView({behavior:'smooth', block:'center'});
}

function renderFormCopy(){
  document.getElementById('form-title').textContent = copy[mode][lang].title;
  document.getElementById('form-sub').textContent = copy[mode][lang].sub;
}

function handleSubmit(e){
  e.preventDefault();
  const form = e.target;
  const ign = form.ign.value;
  const discord = form.discord.value;
  const phone = form.phone.value;
  const recovery = form.recovery_email ? form.recovery_email.value : '';
  const details = form.details.value;

  const subject = encodeURIComponent('Booyah Exchange — ' + mode.toUpperCase() + ' request from ' + ign);
  let bodyLines = [
    'Mode: ' + mode,
    'In-game name: ' + ign,
    'Discord: ' + discord,
    'Phone: ' + phone
  ];
  if(mode !== 'buy'){
    bodyLines.push('Recovery email: ' + recovery);
  }
  bodyLines.push('Details: ' + details);

  const body = encodeURIComponent(bodyLines.join('\n'));
  window.location.href = 'mailto:booyahexchange@gmail.com?subject=' + subject + '&body=' + body;
  return false;
}

setLang('en');
</script>
